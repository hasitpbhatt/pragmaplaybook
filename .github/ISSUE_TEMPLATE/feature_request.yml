name: Feature Request / New Skill
description: Suggest a new skill or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We prefer discussion before implementation.
  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New skill (add a new SKILL.md under skills/)
        - Enhancement to existing skill
        - Framework improvement (AGENTS.md, README, tooling, etc.)
        - Documentation only
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you'd use this. What's the trigger phrase a user would say?
      placeholder: |
        "When I'm debugging a memory leak, I want a skill that..."
        Trigger phrases: "debug this leak", "find memory issue", "why is memory growing"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the skill's Process steps, or the enhancement. Keep it concise — we'll refine in discussion.
      placeholder: |
        Process:
        1. Build a feedback loop that reproduces the leak
        2. Minimize to smallest repro
        3. Hypothesize root causes (caches, listeners, closures)
        4. Instrument and verify
        5. Fix and regression-test
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try? Why didn't existing skills work?
      placeholder: "I tried using debug/SKILL.md but it doesn't cover memory-specific patterns..."
    validations:
      required: false
  - type: checkboxes
    id: willingness
    attributes:
      label: Willingness to contribute
      options:
        - label: I'm willing to draft the SKILL.md (with guidance)
          required: false
        - I can write calibration test cases
          required: false
        - I can help review/test
          required: false