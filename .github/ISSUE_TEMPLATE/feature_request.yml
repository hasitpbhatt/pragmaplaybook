name: Feature Request / New Skill
description: Suggest a new skill or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! We prefer discussion before implementation.
  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - New skill (add a new SKILL.md under skills/)
        - Enhancement to existing skill
        - Framework improvement (AGENTS.md, README, tooling, etc.)
        - Documentation only
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: willingness
    attributes:
      label: Willingness to contribute
      options:
        - label: I'm willing to draft the SKILL.md (with guidance)
          required: false
        - label: I can write calibration test cases
          required: false
        - label: I can help review/test
          required: false
